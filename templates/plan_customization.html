{% extends "base.html" %}
{% block title %}定制我的旅行计划{% endblock %}

{% block content %}
<div class="hero-section text-center" style="padding: 50px 0;">
    <h1 class="main-title mb-4">定制我的旅行计划</h1>
    <p class="main-subtitle mb-4">告诉我们您的旅行偏好，AI将为您量身打造专属行程</p>
</div>

<div class="container mt-5" style="padding-bottom: 5rem;">
    <div class="row">
        <div class="col-lg-8 offset-lg-2">
            <div class="plan-form-container">
                <h2 class="form-title">请尽情描述您对旅行的构想</h2>
                <form id="plan-form" action="#" method="post">
                    <div class="mb-4">
                        <textarea name="travel_plan" class="pulsing-textarea" placeholder="例如：
- 我想去一个有雪山和湖泊的城市，比如瑞士的因特拉肯
- 预算大约在8000元，玩5天
- 我喜欢自然风光，也想逛逛当地的特色小店
- 我是摄影爱好者，希望能推荐一些绝美的拍照地点
- ..."></textarea>
                    </div>
                    <div class="submit-button-container">
                        <button type="submit" class="form-submit-btn" id="submit-btn">生成专属旅行计划</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>


<!-- 判断是否登录，若还没登录则提示用户登录 -->
<script>
    const isLoggedIn = {{ is_logged_in|tojson | safe }};
    document.getElementById('plan-form').addEventListener('submit', function(e) {
        if (!isLoggedIn) {
            e.preventDefault();
            if (confirm('请先登录后再生成专属旅行计划，是否前往登录？')) {
                window.location.href = "{{ url_for('login') }}";
            }
        }
    });
</script>
{% endblock %}
