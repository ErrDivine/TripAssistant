<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}旅游助手{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/transfusion/kaixinsong-webfont/KaiXinSong.min.css"/>
</head>
<body>
    
    <!-- 新增：动态星云背景层 -->
    <div class="aurora-bg">
        <div class="aurora-blob"></div>
        <div class="aurora-blob"></div>
        <div class="aurora-blob"></div>
        <div class="aurora-blob"></div>
    </div>

    <header class="global-header">
        <nav class="main-nav">
            <a href="{{ url_for('index') }}"><i class="fas fa-home"></i>首页</a> 
            <a href="{{ url_for('plan_customization') }}"><i class="fas fa-compass"></i>定制行程</a> 
            <a href="{{ url_for('user_center') }}"><i class="fas fa-images"></i>用户中心</a> 
            <a href="{{ url_for('help') }}"><i class="fas fa-users"></i>帮助</a> 
            <a href="{{ url_for('about') }}"><i class="fas fa-cog"></i>关于我们</a> 
            {% if session.get('user_id') %}
                <!-- 已登录则不显示登录，显示用户名和退出 -->
                <!-- <span style="color:#fff; font-weight:bold;">{{ session.get('username') }}</span> -->
                
                <a href="{{ url_for('logout') }}">退出登录</a>
            {% else %}
                <a href="{{ url_for('login') }}">登录</a> 
                <a href="{{ url_for('register') }}">注册</a>
            {% endif %}
        </nav>
    </header>
    <div class="main-content" style="z-index: 3;">
        {% block content %}{% endblock %}
    </div>



    <!-- 导航栏悬停视觉效果反馈 -->
    
    <script>

    // 新增导航栏视觉效果反馈
    document.querySelectorAll('.main-nav a').forEach(link =>{
        link.addEventListener('mouseenter',function(){
            this.style.transform='translateY(-3px)';
        });

        link.addEventListener('mouseleave',function(){
            this.style.transform='translateY(0)';
        });
    });
    // 新增：光随心动效果脚本
    document.addEventListener('pointermove', (e) => {
        document.body.style.setProperty('--x', e.clientX + 'px');
        document.body.style.setProperty('--y', e.clientY + 'px');
    });

    // 新增：滚动感知动画脚本
    document.addEventListener('DOMContentLoaded', () => {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                }
            });
        }, {
            threshold: 0.1 // 元素进入视野10%时触发
        });

        const targets = document.querySelectorAll('.feature-panel');
        targets.forEach(target => {
            observer.observe(target);
        });
    });
    </script>
</body>
</html>
